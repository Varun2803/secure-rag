name: Backend tests

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install declared backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run complete backend test suite
        run: python -m pytest backend/tests -vv

      - name: Build and validate clean source archive
        run: python scripts/package_release.py
