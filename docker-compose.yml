services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securerag}
      POSTGRES_USER: ${POSTGRES_USER:-securerag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  qdrant:
    image: qdrant/qdrant:v1.13.2
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes: ["qdrant_data:/qdrant/storage"]
    ports: ["127.0.0.1:${QDRANT_PORT:-6333}:6333"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend-volume-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "0:0"
    read_only: true
    restart: "no"
    network_mode: none
    entrypoint: ["python", "-c"]
    command:
      - |
        import os
        from pathlib import Path
        for name in ("documents", "model-cache"):
            root = Path("/var/lib/securerag/documents" if name == "documents" else "/var/cache/huggingface")
            marker = root / ".securerag-owner-10001"
            if not marker.exists():
                for current, directories, files in os.walk(root, topdown=False):
                    for filename in files:
                        os.chown(os.path.join(current, filename), 10001, 10001, follow_symlinks=False)
                    for directory in directories:
                        path = os.path.join(current, directory)
                        os.chown(path, 10001, 10001, follow_symlinks=False)
                        if not os.path.islink(path):
                            os.chmod(path, 0o750)
                os.chown(root, 10001, 10001, follow_symlinks=False)
                os.chmod(root, 0o750)
                marker.touch(mode=0o600)
                os.chown(marker, 10001, 10001, follow_symlinks=False)
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - documents_data:/var/lib/securerag/documents
      - model_cache:/var/cache/huggingface
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    command:
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - ${BACKEND_WORKERS:-1}
      - --timeout-graceful-shutdown
      - ${BACKEND_UVICORN_GRACEFUL_SHUTDOWN_TIMEOUT:-30}
    cpus: ${BACKEND_CPUS:-2.0}
    mem_limit: ${BACKEND_MEMORY_LIMIT:-4g}
    pids_limit: ${BACKEND_PIDS_LIMIT:-256}
    stop_grace_period: ${BACKEND_STOP_GRACE_PERIOD:-45s}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${BACKEND_TMPFS_SIZE:-256m},mode=0700,uid=10001,gid=10001
    environment:
      APP_NAME: ${APP_NAME:-SecureRAG}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-false}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-securerag}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-securerag}
      QDRANT_URL: ${QDRANT_CONTAINER_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      JWT_ISSUER: ${JWT_ISSUER:-securerag}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-securerag-api}
      DOCUMENT_STORAGE_PATH: /var/lib/securerag/documents
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-20971520}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-500}
      MAX_FILENAME_LENGTH: ${MAX_FILENAME_LENGTH:-255}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_CHUNK_SIZE: ${EMBEDDING_CHUNK_SIZE:-800}
      EMBEDDING_CHUNK_OVERLAP: ${EMBEDDING_CHUNK_OVERLAP:-120}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-securerag_chunks}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-800}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      RAG_MAX_CONTEXT_TOKENS: ${RAG_MAX_CONTEXT_TOKENS:-6000}
      RAG_MAX_CONTEXT_CHUNKS: ${RAG_MAX_CONTEXT_CHUNKS:-8}
      RAG_MAX_ANSWER_TOKENS: ${RAG_MAX_ANSWER_TOKENS:-800}
    volumes:
      - documents_data:/var/lib/securerag/documents
      - model_cache:/var/cache/huggingface
    ports: ["127.0.0.1:${BACKEND_PORT:-8000}:8000"]
    depends_on:
      backend-volume-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
volumes:
  postgres_data:
  qdrant_data:
  documents_data:
  model_cache:
